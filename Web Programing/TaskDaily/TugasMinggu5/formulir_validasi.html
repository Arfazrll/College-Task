<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Validasi - Dark Mode</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #ffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-wrapper {
            width: 100%;
            max-width: 450px;
        }
        .card {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="form-wrapper">
        
        <div id="notification" class="mb-3"></div>
        <div class="card p-4 border-0">
            <div class="card-body">
                <h1 class="card-title text-center h3 mb-4">Buat Akun</h1>
                
                <!-- Form -->
                <form id="validationForm" novalidate>
                    <!-- Input Nama -->
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama Anda" required>
                    </div>
                    
                    <!-- Input Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="contoh@domain.com" required>
                    </div>

                    <!-- Input Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 8 karakter" required>
                    </div>
                    
                    <!-- Tombol Kirim -->
                    <button type="submit" class="btn btn-primary w-100">
                        Send
                    </button>
                </form>

                <div id="message" class="mt-3 text-center text-sm"></div>
            </div>
        </div>
    </div>

    <script>

        const form = document.getElementById('validationForm');
        const namaInput = document.getElementById('nama');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageDiv = document.getElementById('message');
        const notificationDiv = document.getElementById('notification');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            messageDiv.textContent = '';
            notificationDiv.innerHTML = '';
            messageDiv.className = 'mt-3 text-center text-sm';

            const nama = namaInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (nama === '' || email === '' || password === '') {
                displayMessage('Semua kolom harus diisi.', 'error');
                return; 
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                displayMessage('Format email tidak valid.', 'error');
                return; 
            }

            if (password.length < 8) {
                displayMessage('Password harus memiliki minimal 8 karakter.', 'error');
                return; 
            }

            displayMessage('Formulir berhasil dikirim!', 'success');
            form.reset();
        });

        function displayMessage(message, type) {
            if (type === 'error') {
                messageDiv.textContent = message;
                messageDiv.classList.add('text-danger');
            } else if (type === 'success') {
                const successAlert = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
                notificationDiv.innerHTML = successAlert;
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
