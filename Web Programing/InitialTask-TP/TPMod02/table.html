<!DOCTYPE html>
<html>
<head>
  <title>Layout Table</title>
  <style>
    table, td {
      border: 1px solid black;
      border-collapse: collapse;
      text-align: center;
      width: 300px;
      height: 50px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td rowspan="2">A</td>
      <td>B</td>
      <td>C</td>
    </tr>
    <tr>
      <td>D</td>
      <td>E</td>
    </tr>
    <tr>
      <td>F</td>
      <td colspan="2">G</td>
    </tr>
  </table>
</body>
</html>
